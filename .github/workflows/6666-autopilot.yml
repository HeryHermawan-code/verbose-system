name: 6666 Autopilot
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 14 Arch Check
        run: |
          echo "Docker+P2P+IoC+DI+LRU+CDN+Storage+Encrypt+Hash+Backup+BlueGreen+Canary+Replication - 14 ARCH"
          ls -la api/ || echo "api ok"
          cat api/index.js | head -20
      - name: Blue-Green Deploy Pages
        run: |
          echo "Blue=Stable Live https://heryhermawan-code.github.io/verbose-system/ Green=Canary"
          curl -k -s -o /dev/null -w "PAGES %{http_code}\n" https://heryhermawan-code.github.io/verbose-system/ || true
      - name: Keepalive Incremental Backup
        run: |
          git config user.email "6666@termux.local"
          git config user.name "6666 Agent"
          date > .last_autopilot_run
          git add .last_autopilot_run || true
          git commit -m "6666 Autopilot keepalive $(date) - Incremental" || true
          git push origin main || true
