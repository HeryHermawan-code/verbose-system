name: Jarvis CI Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Run Automation Test
      run: |
        python -m pip install --upgrade pip
        echo ✅ Sistem otomatisasi GitHub Actions berjalan sukses untuk PT Green Resources Metaverse!

